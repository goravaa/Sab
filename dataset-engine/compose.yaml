services:
  vllm:
    image: vllm/vllm-openai:v0.32.0
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - ${SAB_EMBED_MODEL:-BAAI/bge-m3}
      - --runner
      - pooling
      - --pooler-config.task
      - embed
      - --hf-overrides
      - '{"architectures": ["BgeM3EmbeddingModel"]}'
      - --max-model-len
      - "8192"
      - --api-key
      - ${VLLM_API_KEY:-local-vllm-key}
    ports:
      - "127.0.0.1:${VLLM_PORT:-8001}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dataset-engine:
    image: ${DATASET_ENGINE_IMAGE:-garvw/sab-dataset-engine:2026.10.27}
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "${DATASET_ENGINE_BIND:-127.0.0.1}:${DATASET_ENGINE_PORT:-8000}:8000"
    environment:
      SAB_WORKSPACE: /app/config/workspace.yaml
      SAB_EMBED_MODEL: ${SAB_EMBED_MODEL:-BAAI/bge-m3}
      SAB_LOG_LEVEL: ${SAB_LOG_LEVEL:-INFO}
      SAB_EMBED_BASE_URL: http://vllm:8000/v1
      SAB_EMBED_API_KEY: ${VLLM_API_KEY:-local-vllm-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-west-2}
    env_file:
      - path: .aws-credentials.env
        required: false
    volumes:
      - ./config/workspace.yaml:/app/config/workspace.yaml:ro

volumes:
  huggingface-cache:
