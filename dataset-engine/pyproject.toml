[project]
name = "sab-dataset-engine"
version = "0.2.0"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "main*"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration/tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: exercises the real Postgres and S3-compatible Docker services",
]
