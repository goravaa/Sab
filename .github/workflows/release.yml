name: Release Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish (without the v prefix)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare dataset-engine image tags
        id: engine-meta
        uses: docker/metadata-action@v5
        with:
          images: garvw/sab-dataset-engine
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and publish dataset-engine
        uses: docker/build-push-action@v6
        with:
          context: ./dataset-engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.engine-meta.outputs.tags }}
          labels: ${{ steps.engine-meta.outputs.labels }}

      - name: Prepare query-service image tags
        id: query-meta
        uses: docker/metadata-action@v5
        with:
          images: garvw/sab-query-service
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and publish query-service
        uses: docker/build-push-action@v6
        with:
          context: ./query-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.query-meta.outputs.tags }}
          labels: ${{ steps.query-meta.outputs.labels }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          body_path: RELEASE_NOTES.md
